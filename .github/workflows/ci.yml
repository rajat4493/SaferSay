name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test
        env:
          # Unset on purpose -- e2e suites (*.e2e.test.ts) skip themselves
          # via describe.skip when these aren't set, so CI runs the full
          # non-DB test suite without needing a database.
          SAFERSAY_TEST_DATABASE_URL: ""
          SAFERSAY_TEST_APP_DATABASE_URL: ""
